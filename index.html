<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>OUR JAPAN TOUR</title>

  <!-- פונט Assistant -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700;800&display=swap" rel="stylesheet">

  <!-- הגדרת אייקון למסך הבית -->
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" type="image/png" href="icon.png">

  <style>
    :root {
      --primary: #4a6fa5;
      --primary-soft: #e8eef6;
      --sakura-pink: #fdf2f4;
      --sakura-accent: #e28292;
      --sakura-badge: #fce7eb;
      --bg: #fafbfc;
      --card-bg: #ffffff;
      --text-main: #243242;
      --text-sub: #637381;
      --line: #edf2f7;
      --nav-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      --card-shadow: 0 10px 25px rgba(74, 111, 165, 0.08);
      --radius: 20px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Assistant', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      padding-bottom: 50px;
      direction: rtl;
    }

    /* כותרת עליונה */
    header {
      position: sticky;
      top: 0;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      z-index: 100;
      border-bottom: 1px solid var(--line);
      box-shadow: var(--nav-shadow);
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      object-fit: cover;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      border: 1.5px solid #fff;
    }

    .brand-text h1 {
      font-size: 19px;
      font-weight: 800;
      color: var(--primary);
      line-height: 1.2;
      letter-spacing: 0.5px;
    }

    .brand-text p {
      font-size: 13px;
      color: var(--text-sub);
    }

    .date-badge {
      background: var(--sakura-pink);
      color: var(--sakura-accent);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      border: 1px solid var(--sakura-badge);
    }

    /* פס גלילת ימים אופקי */
    .days-scroller-container {
      background: #fff;
      padding: 12px 0 14px 0;
      border-bottom: 1px solid var(--line);
    }

    .days-scroller {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 0 16px;
      scrollbar-width: none;
    }

    .days-scroller::-webkit-scrollbar {
      display: none;
    }

    .day-pill {
      flex: 0 0 auto;
      padding: 8px 16px;
      border-radius: 30px;
      background: #f1f4f8;
      color: var(--text-sub);
      font-size: 14px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .day-pill.active {
      background: var(--primary);
      color: #fff;
      box-shadow: 0 4px 12px rgba(74, 111, 165, 0.35);
    }

    /* תוכן יום הטיול */
    main {
      padding: 20px 16px;
      max-width: 650px;
      margin: 0 auto;
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 24px 20px;
      box-shadow: var(--card-shadow);
      border: 1px solid rgba(0, 0, 0, 0.03);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .day-date-label {
      font-size: 14px;
      color: var(--text-sub);
      font-weight: 600;
    }

    .city-badge {
      background: var(--sakura-pink);
      color: var(--sakura-accent);
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
    }

    .card-title {
      font-size: 22px;
      font-weight: 800;
      color: #1a202c;
      margin-bottom: 20px;
      line-height: 1.3;
    }

    .section-box {
      margin-bottom: 20px;
    }

    .section-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 8px;
    }

    .section-body {
      font-size: 15px;
      line-height: 1.6;
      color: #4a5568;
    }

    .info-box {
      background: #f8fafc;
      border-right: 4px solid var(--primary);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 20px;
    }

    .info-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      color: #475569;
      margin-bottom: 6px;
    }

    .info-item:last-child {
      margin-bottom: 0;
    }

    /* כפתור מפה וניווט */
    .btn-maps {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #4a6fa5, #3b5984);
      color: #fff;
      text-decoration: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 700;
      box-shadow: 0 4px 14px rgba(74, 111, 165, 0.35);
      transition: transform 0.15s ease;
    }

    .btn-maps:active {
      transform: scale(0.98);
    }

    /* אזור שיתוף קבוצתי ותגובות */
    .community-box {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px dashed var(--line);
    }

    .community-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 12px;
      color: #2d3748;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .comment-list {
      margin-bottom: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .comment-bubble {
      background: #f8fafc;
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 13px;
      border: 1px solid var(--line);
    }

    .comment-meta {
      display: flex;
      justify-content: space-between;
      color: var(--text-sub);
      font-size: 11px;
      margin-bottom: 4px;
    }

    .comment-img {
      max-width: 100%;
      border-radius: 8px;
      margin-top: 8px;
      display: block;
    }

    .comment-form {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .comment-form input,
    .comment-form textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 14px;
      outline: none;
      direction: rtl;
    }

    .comment-form input:focus,
    .comment-form textarea:focus {
      border-color: var(--primary);
    }

    .file-upload-label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--primary);
      cursor: pointer;
      font-weight: 600;
    }

    .file-upload-label input {
      display: none;
    }

    .btn-comment {
      background: var(--primary-soft);
      color: var(--primary);
      border: none;
      padding: 10px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-comment:active {
      background: #dbe4f0;
    }
  </style>
</head>

        mapQuery: "Tokyo Haneda Airport"

    let currentDayIndex = 0;

    // אתחול פס הימים
    function initDaysScroller() {
      const container = document.getElementById('daysScroller');
      container.innerHTML = '';
      itinerary.forEach((item, index) => {
        const btn = document.createElement('button');
        btn.className = `day-pill ${index === currentDayIndex ? 'active' : ''}`;
        btn.textContent = `יום ${item.day} • ${item.city.split(' ')[0]}`;
        btn.onclick = () => selectDay(index);
        container.appendChild(btn);
      });
    }

    // בחירת יום
    function selectDay(index) {
      currentDayIndex = index;
      document.querySelectorAll('.day-pill').forEach((btn, i) => {
        btn.classList.toggle('active', i === index);
      });
      renderDayCard();
    }

    // טעינת תגובות מ-LocalStorage
    function getComments(dayNum) {
      const data = localStorage.getItem(`comments_day_${dayNum}`);
      return data ? JSON.parse(data) : [];
    }

    // שמירת תגובה חדשה
    function addComment(dayNum, author, text, imageBase64) {
      const comments = getComments(dayNum);
      const newComment = {
        author: author || "מטייל/ת",
        text: text,
        image: imageBase64 || null,
        time: new Date().toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' })
      };
      comments.push(newComment);
      localStorage.setItem(`comments_day_${dayNum}`, JSON.stringify(comments));
      renderDayCard();
    }

    // הצגת הכרטיסייה היומית
    function renderDayCard() {
      const day = itinerary[currentDayIndex];
      const comments = getComments(day.day);

      const commentsHtml = comments.map(c => `
        <div class="comment-bubble">
          <div class="comment-meta">
            <strong>${c.author}</strong>
            <span>${c.time}</span>
          </div>
          <div>${c.text}</div>
          ${c.image ? `<img src="${c.image}" class="comment-img" alt="תמונה">` : ''}
        </div>
      `).join('');

      const html = `
        <div class="card-top">
          <span class="day-date-label">${day.date}</span>
          <span class="city-badge">${day.city}</span>
        </div>
        <h2 class="card-title">${day.title}</h2>

        <div class="section-box">
          <div class="section-title">מקומות ואתרים:</div>
          <div class="section-body">${day.sites}</div>
        </div>

        <div class="info-box">
          <div class="info-item">
            <span>💡</span>
            <strong>לוגיסטיקה וטיפים:</strong> ${day.logistics}
          </div>
          <div class="info-item">
            <span>🏨</span>
            <strong>מלון:</strong> ${day.hotel}
          </div>
        </div>

        <a class="btn-maps" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(day.mapQuery)}" target="_blank">
          📍 פתח מפה וניווט ב-Google Maps
        </a>

        <div class="community-box">
          <div class="community-title">💬 טיפים והמלצות מהשטח:</div>
          <div class="comment-list" id="commentList">
            ${comments.length ? commentsHtml : '<p style="font-size:13px; color:#94a3b8;">אין עדיין תגובות ליום זה. היו הראשונים להמליץ!</p>'}
          </div>

          <form class="comment-form" onsubmit="handleCommentSubmit(event, ${day.day})">
            <input type="text" id="commentAuthor" placeholder="השם שלך" required>
            <textarea id="commentText" rows="2" placeholder="שתפו המלצה, טיפ או מקום שאהבתם..." required></textarea>
            
            <label class="file-upload-label">
              📷 הוסף תמונה
              <input type="file" id="commentFile" accept="image/*" onchange="previewUpload(this)">
            </label>
            <span id="fileChosenStatus" style="font-size:11px; color:#64748b;"></span>

            <button type="submit" class="btn-comment">פרסם המלצה ליום זה</button>
          </form>
        </div>
      `;

      document.getElementById('dayCard').innerHTML = html;
    }

    let currentBase64Image = null;

    function previewUpload(input) {
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          currentBase64Image = e.target.result;
          document.getElementById('fileChosenStatus').textContent = 'תמונה נבחרה בהצלחה!';
        };
        reader.readAsDataURL(input.files[0]);
      }
    }

    function handleCommentSubmit(event, dayNum) {
      event.preventDefault();
      const author = document.getElementById('commentAuthor').value;
      const text = document.getElementById('commentText').value;
      addComment(dayNum, author, text, currentBase64Image);
      currentBase64Image = null;
    }

    // הפעלה ראשונית
    initDaysScroller();
    renderDayCard();
  </script>
</body>
</html>
